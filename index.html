<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#15172b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Metrados"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>METRADOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--text:#1e293b;--muted:#475569;--subtle:#64748b;--bg:#f5f4f1;--panel:#fff;--line:#e3e6eb;--soft:#eef1f5;--fill:#f8fafc;--accent:#0f766e;--accent-dk:#0b5c56;--accent-soft:#e6f4f2;--danger:#b42318;--dsoft:#fef3f2;
--cat:#f1eefb;--cat2:#e5dff8;--cat-line:#ddd6f2;--cat-ink:#5a4a9b;--r:14px;--rs:9px;--font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
b{font-weight:600}
svg.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:1.02em;height:1.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--rs);padding:0 14px;min-height:38px;font-size:13.5px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:background .15s,border-color .15s,color .15s,transform .15s;white-space:nowrap}
button:hover{background:#1e293b}button:active{transform:scale(.97)}
button.secondary,button.ghost{background:#fff;color:var(--ink);border-color:#cbd5e1}
button.secondary:hover,button.ghost:hover{background:var(--fill);border-color:#94a3b8}
button.sm{min-height:32px;padding:0 11px;font-size:12.5px}
button.dangerf{background:var(--danger);border-color:var(--danger)}button.dangerf:hover{background:#912018}
button:disabled{opacity:.35;cursor:default;transform:none}
select,input{font-family:inherit;background:#fff;color:var(--ink);border:1px solid #cbd5e1;border-radius:var(--rs);padding:9px 12px;font-size:14px;min-height:38px;transition:border-color .15s,box-shadow .15s;max-width:100%}
input::placeholder{color:#8a97a8}input:hover:not(:disabled){border-color:#94a3b8}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
input[type=number]{-moz-appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* encabezado */
header{display:flex;align-items:center;gap:14px;padding:10px 24px;min-height:62px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.mark{--h:200;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:hsl(var(--h) 40% 21%);color:#fff;font-size:20px;box-shadow:0 0 0 4px hsl(var(--h) 60% 92%);transition:background .5s,box-shadow .5s}
.mark.swap svg{animation:pop .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:rotate(-80deg) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.word{font-weight:700;font-size:18px;letter-spacing:.24em;color:var(--ink)}
#projChip{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);background:var(--fill);border:1px solid var(--line);border-radius:var(--rs);padding:6px 12px;min-width:0}
#projChip:empty{display:none}#projChip b{color:var(--ink)}#projChip span{color:var(--subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sp{flex:1}.actions{display:flex;gap:8px}
#saved{font-size:12.5px;color:var(--accent-dk);display:inline-flex;align-items:center;gap:5px;opacity:0;transform:translateY(3px);transition:.3s}#saved.on{opacity:1;transform:none}
body[data-view=home] #btnExp,body[data-view=home] #btnX,body[data-view=home] #btnP,body[data-view=home] #saved,body[data-view=home] .tabwrap{display:none}

/* especialidades */
.tabwrap{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.arr{background:#fff;color:var(--muted);border:none;border-radius:0;min-height:52px;width:42px;padding:0;font-size:16px}
.arr:hover{background:var(--fill);color:var(--ink)}
.tabbar{position:relative;display:flex;align-items:stretch;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none;padding:0 4px}
.tabbar::-webkit-scrollbar{display:none}
.ind{position:absolute;left:0;bottom:0;height:3px;width:0;border-radius:3px 3px 0 0;background:var(--accent);transition:transform .38s cubic-bezier(.3,.8,.3,1),width .38s cubic-bezier(.3,.8,.3,1),background .38s;pointer-events:none}
.gl{flex:none;align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#a0aab8;padding:0 12px 0 14px;border-left:1px solid var(--line);margin-left:6px;line-height:1.1}
.gl:first-child{border:none;margin:0}
button.tab{--h:200;background:transparent;color:var(--muted);border:none;border-radius:0;padding:0 13px;min-height:52px;font-size:13.5px;font-weight:500;gap:8px;flex:none}
button.tab:hover{background:transparent;color:var(--ink)}
button.tab.active{color:var(--ink);font-weight:600}
.tab .cod{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:hsl(var(--h) 60% 94%);color:hsl(var(--h) 45% 30%);transition:transform .25s}
.tab.active .cod{transform:scale(1.07)}
.tab .n{background:var(--soft);color:var(--muted);border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:600}

/* estructura */
main{display:grid;grid-template-columns:370px 1fr;flex:1;min-height:0}
main.noaside{grid-template-columns:1fr}
section.content{padding:26px;overflow-y:auto}
section.content.inR{animation:inR .42s cubic-bezier(.2,.8,.2,1)}
section.content.inL{animation:inL .42s cubic-bezier(.2,.8,.2,1)}
section.content.inF{animation:inF .4s ease}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* catálogo (pastel) */
aside{background:var(--cat);border-right:1px solid var(--cat-line);padding:18px 14px;overflow-y:auto}
aside[hidden]{display:none}
.ah{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.ah h3{margin:0;font-size:12px;font-weight:700;color:var(--cat-ink);letter-spacing:.09em;text-transform:uppercase}
.acts{display:flex;gap:4px}
button.mini{background:transparent;color:var(--cat-ink);border:none;min-height:26px;padding:0 8px;font-size:12px;border-radius:6px}
button.mini:hover{background:var(--cat2)}
.cat-title{display:flex;gap:9px;align-items:baseline;margin:0 4px 12px;padding:10px 12px;background:#fff;border:1px solid var(--cat-line);border-radius:10px;font-weight:600;color:var(--ink);line-height:1.35;font-size:13.5px}
.cat-title .cod{color:var(--cat-ink)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8d82bd;pointer-events:none}
.search-wrap input{width:100%;padding-left:36px;border-color:var(--cat-line)}
.search-wrap input:focus{border-color:#8b7bd1;box-shadow:0 0 0 3px rgba(139,123,209,.22)}
.ti{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;border-radius:var(--rs);font-size:13.2px;line-height:1.4}
.ti .cod{flex:none;font-variant-numeric:tabular-nums;font-weight:600;color:#8176b8}
.ti .tx{flex:1;min-width:0}
.hd{cursor:pointer;color:var(--ink);font-weight:600;user-select:none}
.hd:hover{background:var(--cat2)}
.hd .ic{margin-top:2px;color:#9a90c8;transition:transform .25s}
.grp.open>.hd .ic{transform:rotate(90deg)}
.hd.lv2{margin-top:8px;font-size:13.8px}.hd.lv2 .cod{color:var(--cat-ink)}
.hd.lv3{font-weight:600;color:#2d2a4a}.hd.lv3,.hd.lv4{padding-left:18px}
.part{cursor:pointer;color:var(--text);padding-left:calc(14px + var(--lv)*9px);transition:background .12s;position:relative}
.part:hover{background:var(--cat2)}
.part .u{flex:none;background:#fff;border:1px solid var(--cat-line);color:var(--cat-ink);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:600}
.part .pl{flex:none;opacity:0;color:var(--cat-ink);margin-top:1px;transition:opacity .15s}
.part:hover .pl{opacity:1}
.part.used .cod::after{content:"●";color:#7fbf9f;margin-left:5px;font-size:9px}
.gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.grp.open>.gb{grid-template-rows:1fr}
.gi{overflow:hidden;min-height:0}
.empty{color:var(--muted);text-align:center;padding:40px 20px;line-height:1.6}
.empty .ic{display:block;width:34px;height:34px;margin:0 auto 12px;color:#94a3b8;stroke-width:1.5}
.empty.sm{padding:20px}

/* contenido */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 3px rgba(15,23,42,.05);padding:22px;margin-bottom:20px}
.card h2{font-size:15.5px;margin:0 0 16px;display:flex;align-items:center;gap:.6em;color:var(--ink)}
.card h2 svg{color:var(--accent)}
.thead{--h:200;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.tcode{font-size:15px;font-weight:700;padding:7px 12px;border-radius:10px;background:hsl(var(--h) 60% 93%);color:hsl(var(--h) 45% 28%)}
.thead h2{margin:0;font-size:20px;color:var(--ink);letter-spacing:-.2px;line-height:1.25}.thead p{margin:0;color:var(--subtle);font-size:13px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 3px rgba(15,23,42,.05);margin-bottom:16px;overflow:hidden;animation:inF .35s ease}
.bh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#fff,#fafbfc);flex-wrap:wrap}
.bt{display:flex;gap:10px;font-weight:600;color:var(--ink);min-width:0}.bt .cod{color:var(--accent-dk);flex:none}
.bm{display:flex;align-items:center;gap:10px}
.tot{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:0 6px}.tot small{font-size:10.5px;color:var(--subtle);text-transform:uppercase;letter-spacing:.07em}.tot b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;background:var(--soft);color:#334155;font-weight:600}
select.usel{min-height:32px;padding:3px 8px;font-size:12.5px;border-color:#e9b44c;background:#fffaf0}
.tbl-wrap{overflow-x:auto}
table{width:100%;min-width:780px;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f0f2f5;vertical-align:middle}
th{background:var(--fill);color:#334155;font-weight:600;font-size:12.5px;white-space:nowrap}
th.na{color:#b9c0cc;font-weight:500;text-decoration:line-through}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .8s}tr.hl{background:#fff6d6}
td input{width:76px;padding:6px 9px;min-height:34px;font-size:13.5px}
td input.desc{width:100%;min-width:150px}td input.num,.num{text-align:right}
.nacell input{width:76px;background:repeating-linear-gradient(135deg,#f4f5f7 0 6px,#eceef2 6px 12px);border-color:#eceef2;cursor:not-allowed;text-align:center;color:#b3bac6}
button.del-row{background:transparent;border:1px solid transparent;color:var(--subtle);width:34px;min-height:34px;height:34px;padding:0}
button.del-row:hover{background:var(--dsoft);color:var(--danger)}
.pv{font-size:14px}
table.plain{min-width:640px}table.plain th,table.plain td{padding:10px 12px}
.cod2{font-weight:600;color:var(--accent-dk)}
.bar{background:#e8edf3;border-radius:99px;overflow:hidden;height:8px;width:calc(100% - 50px);display:inline-block;vertical-align:middle}
.bar i{display:block;background:var(--accent);height:100%;border-radius:99px;transition:width .6s}
.pct{display:inline-block;width:44px;text-align:right;font-size:12.5px;color:var(--muted);vertical-align:middle}
tr.lnk{cursor:pointer}tr.lnk:hover td{background:var(--fill)}
.toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin:14px 0 5px}label i{color:var(--danger);font-style:normal}
.two input,.three input,.modal>input{width:100%}

/* proyectos */
.home{max-width:1180px;margin:0 auto}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.home h1{font-size:28px;margin:0;letter-spacing:-.4px;color:var(--ink)}.home-head p{margin:2px 0 0;color:var(--subtle)}
.home-head .tools{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px}
.pcard{--h:200;position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px 14px;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .22s;animation:inF .5s both;animation-delay:calc(var(--i,0)*50ms);display:flex;flex-direction:column;gap:6px}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:hsl(var(--h) 55% 62%)}
.pcard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(15,23,42,.1);border-color:hsl(var(--h) 40% 78%)}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.pc-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:hsl(var(--h) 60% 92%);color:hsl(var(--h) 45% 28%);font-size:19px}
.pc-btns{display:flex;gap:2px;opacity:.55;transition:opacity .2s}.pcard:hover .pc-btns{opacity:1}
.pcard h3{margin:8px 0 0;font-size:16.5px;color:var(--ink);line-height:1.3}.pc-loc{margin:0;color:var(--subtle);font-size:13px}
.pc-stats{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.pc-chips{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}.pc-chips span{--h:200;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:hsl(var(--h) 60% 94%);color:hsl(var(--h) 45% 30%)}
.pc-foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--soft);font-size:12px;color:var(--subtle)}
.pcard.newc{border:2px dashed #cbd5e1;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--muted);min-height:200px;gap:10px}
.pcard.newc::before{display:none}.pcard.newc:hover{border-color:var(--accent);color:var(--accent-dk);background:var(--accent-soft)}
.pcard.newc .pc-ic{width:50px;height:50px;font-size:24px;background:#fff;color:var(--accent)}
.home .search{width:230px}

/* ventanas */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;padding:26px;width:540px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 56px rgba(15,23,42,.22);animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
.modal h2{font-size:20px;margin:0 0 4px;color:var(--ink)}.mp{margin:0 0 6px;color:var(--subtle);font-size:13.5px}

header,.tabwrap,html[data-theme=dark] header,html[data-theme=dark] .tabwrap{background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(16px) saturate(1.3);position:relative;z-index:5}

aside{background:linear-gradient(180deg,var(--cat),color-mix(in srgb,var(--cat2) 65%,var(--cat)))}
.home h1{background:linear-gradient(100deg,var(--ink) 35%,hsl(var(--h2) 60% 46%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.pcard::before{background:linear-gradient(90deg,hsl(var(--h) 60% 62%),hsl(calc(var(--h) + 55) 62% 66%))}
.kpi{--kh:var(--h1);background:linear-gradient(135deg,hsl(var(--kh) 60% 92% / .75),var(--fill))}
.kpi:nth-child(2){--kh:var(--h2)}.kpi:nth-child(3){--kh:var(--h3)}.kpi:nth-child(4){--kh:var(--h1)}.kpi:nth-child(5){--kh:var(--h2)}
html[data-theme=dark] .kpi{background:linear-gradient(135deg,hsl(var(--kh) 45% 26% / .7),var(--fill))}
.kpi.bad,.kpi.warn{background:var(--dsoft)}.kpi.warn{background:#fffaf0}html[data-theme=dark] .kpi.bad{background:#3a2335}html[data-theme=dark] .kpi.warn{background:#2f2c33}

/* layout estable: el panel derecho ya no se corre al abrir */
main{grid-template-columns:370px minmax(0,1fr);transition:grid-template-columns .65s var(--ease),opacity .9s var(--ease) .15s,transform .9s var(--ease) .15s}

.tview{margin:0 auto}

/* apertura */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:22px;cursor:pointer;background:radial-gradient(900px 620px at 18% 8%,var(--m1),transparent 60%),radial-gradient(800px 600px at 86% 92%,var(--m2),transparent 60%),radial-gradient(700px 500px at 90% 6%,var(--m3),transparent 60%),var(--bg);transition:opacity .85s var(--ease),transform .85s var(--ease),filter .85s var(--ease)}

@keyframes imk{from{opacity:0;transform:scale(.4) rotate(-90deg)}}

/* menú de vistas (arriba a la izquierda) */
.vmenu{position:relative;flex:none}body[data-view=home] .vmenu{display:none}

/* metrados: más limpios */

/* ---------- catálogo ---------- */
function buildTree(items){const roots=[],st=[];items.forEach(it=>{const n={...it,children:it.t==='PARTIDA'?null:[]};if(it.n===1){roots.push(n);st[0]=n}else{const p=st[it.n-2];if(p)p.children.push(n);st[it.n-1]=n}});return roots}
const TREE=buildTree(CATALOGO), TITULOS=CATALOGO.filter(x=>x.n===1), BYC={}, IDX={};
CATALOGO.forEach((x,i)=>{BYC[x.c]=x;IDX[x.c]=i});
const ORDER=TITULOS.map(t=>t.c), VIEWS=[...ORDER,'consolidado','resumen'];
const UNITS=['','Metro (m)','Metro cuadrado (m2)','Metro cúbico (m3)','Kilogramo (kg)','Unidad (Und.)','Global (Glb.)'];

/* dimensiones que aplican según la unidad de la partida */
const DF={n:['nVeces','N° veces'],l:['largo','Largo'],a:['ancho','Ancho'],h:['alto','Alto']};
const uKey=u=>{const a=uAbbr(u).toLowerCase().replace('.','');return a==='m2'?'M2':a==='m3'?'M3':a==='m'?'M':a==='kg'?'KG':a==='und'?'UND':a==='glb'?'GLB':''};
function dimsOf(u){const k=uKey(u);return k==='M2'?['n','l','a']:k==='M'?['n','l']:(k==='UND'||k==='GLB')?['n']:['n','l','a','h']}
const numOf=v=>(v===''||v==null||isNaN(parseFloat(v)))?null:parseFloat(v);
/* Parcial como en el Excel: vacío si no hay ninguna medida; una medida en blanco equivale a 1; negativos = deducciones */
function calc(m){const d=dimsOf(m.unidad);let any=false,txt=false,pr=1;
  ['n','l','a','h'].forEach(k=>{const raw=m[DF[k][0]];if(raw===''||raw==null)return;const v=parseFloat(raw);if(isNaN(v)){txt=true;return}any=true;if(d.includes(k))pr*=v});
  return(any&&!txt)?pr:null}
const nz=m=>{const v=calc(m);return v==null?0:v}, fmt=v=>v==null?'—':v.toFixed(2);
function estado(m){const k=uKey(m.unidad),ab=uAbbr(m.unidad),v=calc(m),has=f=>numOf(m[f])!=null,hL=has('largo'),hA=has('ancho'),hH=has('alto');
  if(!['nVeces','largo','ancho','alto'].some(f=>m[f]!==''&&m[f]!=null))return['pend','… Ingresa las medidas'];
  if(v==null)return['err','✖ Hay texto en las medidas'];
  if((k==='UND'||k==='GLB')&&(hL||hA||hH))return['warn','⚠ Largo/Ancho/Alto no se usan en '+ab];
  if(k==='M'&&(hA||hH))return['warn','⚠ Ancho/Alto no se usan en '+ab];
  if(k==='M2'&&hH)return['warn','⚠ Alto no se usa en '+ab];
  if(!k)return['info','ℹ Unidad sin definir'];
  const f=[];if((k==='M'||k==='M2'||k==='M3')&&!hL)f.push('Largo');if((k==='M2'||k==='M3')&&!hA)f.push('Ancho');if(k==='M3'&&!hH)f.push('Alto');
  if(f.length)return['warn','⚠ Falta '+f.join('/')];
  return v<0?['ok','✔ OK · deducción']:['ok','✔ OK']}
const isAlert=m=>{const t=estado(m)[0];return t==='warn'||t==='err'};
const estHTML=m=>{const e=estado(m),t=e[0];return'<span class="est e-'+t+'" title="'+esc(e[1])+'">'+(t==='ok'?'✔':t==='pend'?'·':esc(e[1]))+'</span>'};
function stats(p){const ms=p.mediciones,me=ms.filter(m=>calc(m)!=null);
  return{nm:me.length,np:new Set(me.map(m=>m.codigo)).size,al:ms.filter(isAlert).length,su:new Set(ms.filter(m=>!uKey(m.unidad)).map(m=>m.codigo)).size}}
const ANC={};(()=>{const st=[];CATALOGO.forEach(x=>{st[x.n-1]=x;st.length=x.n;if(x.t==='PARTIDA')ANC[x.c]=st.slice(0,-1)})})();
const SHORT={'OE.1':'Obras provisionales','OE.2':'Estructuras','OE.3':'Arquitectura','OE.4':'Inst. sanitarias','OE.5':'Inst. eléct. y mecán.','OE.6':'Inst. comunicaciones','OE.7':'Inst. de gas','HU.1':'Obras provisionales','HU.2':'Pistas y veredas','HU.3':'Infra. sanitaria','HU.4':'Infra. eléctrica','HU.5':'Infra. comunicac.','HU.6':'Infra. de gas'};

const openSt=new Map();
function nodeHTML(n,f,used){

  const kids=n.children.map(c=>nodeHTML(c,f,used)).join('');if(f&&!kids)return'';
  const o=f?true:(openSt.has(n.c)?openSt.get(n.c):n.n<=2);
  return '<div class="grp'+(o?' open':'')+'" data-c="'+n.c+'"><div class="ti hd lv'+n.n+'">'+I('chev','sm')+'<b class="cod">'+n.c+'</b><span class="tx">'+esc(n.d)+'</span></div><div class="gb"><div class="gi">'+kids+'</div></div></div>'}
function renderTree(){const p=proj(),root=TREE.find(r=>r.c===tab),as=$('#aside');
  as.hidden=!p||!root;$('main').classList.toggle('noaside',as.hidden);if(as.hidden)return;

/* ---------- consolidado y resumen ---------- */
function consolidar(p){const c={};p.mediciones.forEach(m=>{const o=c[m.codigo]||(c[m.codigo]={codigo:m.codigo,descripcion:m.descripcion,unidad:m.unidad,categoria:m.categoria,total:0,n:0,al:0}),v=calc(m);if(v!=null){o.total+=v;o.n++}if(isAlert(m))o.al++});
  return Object.values(c).filter(o=>o.n||o.al).sort((a,b)=>(IDX[a.codigo]??1e9)-(IDX[b.codigo]??1e9))}
function consolidadoHTML(p,cat){const all=consolidar(p),it=cat?all.filter(c=>c.categoria===cat):all,
  S=cat?{np:it.filter(c=>c.n).length,nm:it.reduce((s,c)=>s+c.n,0),al:it.reduce((s,c)=>s+c.al,0)}:stats(p);

  else{h+='<p class="sub">Partidas medidas: <b>'+S.np+'</b> · Mediciones: <b>'+S.nm+'</b> · Alertas: <b class="'+(S.al?'bad':'')+'">'+S.al+'</b></p><div class="tbl-wrap"><table class="plain"><thead><tr><th class="num">Ítem</th><th>Código</th><th>'+(cat?'Subtítulo › Partida':'Título › Subtítulo › Partida')+'</th><th>Und.</th><th class="num">Mediciones</th><th class="num">Metrado total</th><th class="num">Alertas</th></tr></thead><tbody>';
    let i=0;const last=[];
    it.forEach(c=>{(ANC[c.codigo]||[]).forEach((a,x)=>{if(cat&&x===0)return;if(last[x]!==a.c){last.length=x;last[x]=a.c;h+='<tr class="gh l'+Math.min(a.n,3)+'" style="--h:'+(META[a.c]?META[a.c][1]:(META[c.categoria]||[0,200])[1])+'"><td></td><td class="cod2">'+a.c+'</td><td colspan="5" style="padding-left:'+(12+(a.n-1-(cat?1:0))*14)+'px">'+esc(a.d)+'</td></tr>'}});
      h+='<tr><td class="num">'+(++i)+'</td><td class="cod2">'+esc(c.codigo)+'</td><td style="padding-left:'+(12+((BYC[c.codigo]||{n:4}).n-1-(cat?1:0))*14)+'px">'+esc(c.descripcion)+'</td><td><span class="pill">'+esc(uAbbr(c.unidad))+'</span></td><td class="num">'+c.n+'</td><td class="num"><b>'+c.total.toFixed(2)+'</b></td><td class="num">'+(c.al?'<span class="est e-warn">⚠ '+c.al+'</span>':'')+'</td></tr>'});
    h+='</tbody></table></div>'}
  return h+'<div class="toolbar"><button data-act="xlsx">'+I('save')+'Descargar Excel (.xlsx)</button><button data-act="print">'+I('printer')+'Guardar PDF</button><button class="secondary" data-act="csvc">'+I('save')+'Consolidado CSV</button><button class="secondary" data-act="csvm">'+I('save')+'Planilla CSV</button></div></div>'}

  const T=[0,0,0,0],bar=pc=>'<span class="bar"><i style="width:'+pc.toFixed(0)+'%"></i></span><span class="pct">'+pc.toFixed(0)+'%</span>',al=n=>n?'<span class="est e-warn">⚠ '+n+'</span>':'—';

    ['xl/styles.xml',STYLES],...sh.map((x,i)=>['xl/worksheets/sheet'+(i+1)+'.xml',x[1]])];
  saveBlob((p.nombre||'proyecto')+'_metrados.xlsx',zipStore(files));toast('Excel descargado')}
function printHTML(p){const S=stats(p),it=consolidar(p),row=(a,b)=>'<tr><th>'+a+'</th><td>'+esc(b||'—')+'</td></tr>';
  let h='<h1>Planilla de metrados</h1><table class="pd-info">'+row('Proyecto / Obra',p.nombre)+row('Expediente',p.expediente)+row('Ubicación',p.ubicacion)+row('Dpto. / Provincia / Distrito',[p.departamento,p.provincia,p.distrito].filter(Boolean).join(' / '))+row('Propietario / Entidad',p.cliente)+row('Elaborado por',p.elaboradoPor)+row('Fecha',p.fecha)+row('Fecha de impresión',new Date().toLocaleDateString('es-PE'))+'</table><p><b>'+S.nm+'</b> mediciones · <b>'+S.np+'</b> partidas medidas · <b>'+S.al+'</b> alertas</p>';
  TITULOS.forEach(t=>{const ms=p.mediciones.filter(m=>m.categoria===t.c);if(!ms.length)return;h+='<h2>'+t.c+' · '+esc(t.d)+'</h2>';
    [...new Set(ms.map(m=>m.codigo))].sort(byOrd).forEach(c=>{const rs=ms.filter(m=>m.codigo===c),d=dimsOf(rs[0].unidad),n=BYC[c]||{d:rs[0].descripcion};
      h+='<table class="pd-t"><caption><b>'+c+'</b> — '+esc(n.d)+' ('+esc(uAbbr(rs[0].unidad)||'sin unidad')+')</caption><thead><tr><th>Ubicación / Elemento</th><th>N° veces</th><th>Largo</th><th>Ancho</th><th>Alto</th><th>Parcial</th><th>Observaciones</th></tr></thead><tbody>'
      +rs.map(m=>'<tr><td>'+esc(m.ubicacionElemento)+'</td>'+['nVeces','largo','ancho','alto'].map((f,i)=>'<td class="r">'+(d.includes('nlah'[i])?esc(m[f]):'')+'</td>').join('')+'<td class="r"><b>'+fmt(calc(m))+'</b></td><td>'+esc(m.observaciones)+'</td></tr>').join('')
      +'<tr class="tot"><td colspan="5" class="r">Total</td><td class="r">'+rs.reduce((a,m)=>a+nz(m),0).toFixed(2)+'</td><td></td></tr></tbody></table>'})});
  h+='<h2 class="pb">Consolidado de metrados por partida</h2><table class="pd-t"><thead><tr><th>Ítem</th><th>Código</th><th>Partida</th><th>Und.</th><th>Med.</th><th>Metrado total</th></tr></thead><tbody>'+it.map((c,i)=>'<tr><td class="r">'+(i+1)+'</td><td>'+esc(c.codigo)+'</td><td>'+esc(c.descripcion)+'</td><td>'+esc(uAbbr(c.unidad))+'</td><td class="r">'+c.n+'</td><td class="r"><b>'+c.total.toFixed(2)+'</b></td></tr>').join('')+'</tbody></table>'
   +'<h2>Control y aprobación</h2><table class="pd-t sig"><thead><tr><th>Responsable</th><th>Nombre y apellidos</th><th>Firma y sello</th><th>Fecha</th></tr></thead><tbody><tr><td>Elaborado por</td><td>'+esc(p.elaboradoPor)+'</td><td></td><td></td></tr><tr><td>Revisado por</td><td></td><td></td><td></td></tr><tr><td>Aprobado por</td><td></td><td></td><td></td></tr></tbody></table>';
  return h}
function printPDF(p){$('#printDoc').innerHTML=printHTML(p);document.body.classList.add('printing');toast('En la ventana de impresión elige “Guardar como PDF”');setTimeout(()=>window.print(),400)}
addEventListener('afterprint',()=>document.body.classList.remove('printing'));

/* ---------- render ---------- */
const content=$('#content');
function anim(dir){content.classList.remove('inR','inL','inF','go');if(!dir)return;void content.offsetWidth;content.scrollTop=0;content.style.setProperty('--dx',dir==='R'?'18px':dir==='L'?'-18px':'0px');
  $$('.tview>*,.home-head,:scope>.card',content).forEach((e,i)=>{e.classList.add('rs');e.style.setProperty('--d',Math.min(i,16))});content.classList.add('go')}
function render(dir,o={}){const p=proj();document.body.dataset.view=p?'project':'home';const chip=$('#projChip');
  if(!p){openSheet(false);chip.innerHTML='';setMark('def');$('#aside').hidden=true;$('main').classList.add('noaside');content.innerHTML=homeHTML();anim(dir||'F');return}
  refreshChip(p);chip.dataset.act='editdatos';chip.title='Editar datos del proyecto';chip.style.cursor='pointer';
  updateTabs(p);setMark(tab);if(ORDER.includes(tab))lastT=tab;
  $$('#bnav [data-n]').forEach(b=>b.classList.toggle('on',(b.dataset.n==='med'&&ORDER.includes(tab))||(b.dataset.n==='con'&&tab==='consolidado')||(b.dataset.n==='res'&&tab==='resumen')));
  if(o.tree!==false)renderTree();
  content.innerHTML=tab==='resumen'?resumenHTML(p):tab==='consolidado'?consolidadoHTML(p):titleHTML(p,tab);anim(dir)}

/* ---------- eventos ---------- */
content.addEventListener('input',e=>{
  if(e.target.id==='pfilter'){$('#pgrid').innerHTML=gridHTML(e.target.value);return}
  const i=e.target.closest('input.f');if(!i)return;const tr=i.closest('tr'),p=proj(),m=p.mediciones.find(x=>x.id===tr.dataset.id);
  m[i.dataset.f]=i.value;touch(p);{const pv=$('.pv',tr);pv.textContent=fmt(calc(m));pv.classList.toggle('neg',calc(m)<0);$('.st',tr).innerHTML=estHTML(m)}
  const blk=tr.closest('.blk');$('.tv',blk).textContent=p.mediciones.filter(x=>x.codigo===blk.dataset.cod&&x.categoria===tab).reduce((s,x)=>s+nz(x),0).toFixed(2);updateBadges(p)});
content.addEventListener('change',e=>{if(!e.target.matches('.usel')||!e.target.value)return;const p=proj(),blk=e.target.closest('.blk');
  p.mediciones.forEach(m=>{if(m.codigo===blk.dataset.cod&&m.categoria===tab)m.unidad=e.target.value});touch(p);render(null,{tree:false})});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();if(!palPop.hidden)togglePal(false)}
  if(e.key==='Enter'&&e.target.matches('.pcard'))e.target.click();
  if(e.altKey&&proj()&&!root.innerHTML&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const i=ORDER.indexOf(tab)+(e.key==='ArrowRight'?1:-1);if(ORDER[i])go(ORDER[i])}});
root.addEventListener('mousedown',e=>{if(e.target.classList.contains('modal-bg'))closeModal()});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,p=proj();
  if(el.closest('.msheet'))closeModal();
  if(a==='cat')return openSheet(true);
  if(a==='scrim')return openSheet(false);
  if(a==='mmed')return go(lastT||ORDER[0]);
  if(a==='more')return moreModal();
  if(a==='vmenu')return toggleV();
  if(a==='goview'){toggleV(false);return go(el.dataset.t)}
  if(a==='fold'){const bk=el.closest('.blk'),k=tab+bk.dataset.cod;bk.classList.toggle('collapsed')?COLL.add(k):COLL.delete(k);return}
  if(a==='pal')return togglePal();
  if(a==='setpal')return setPal(el.dataset.id);
  if(a==='setmode')return smooth(()=>setTheme(el.dataset.m,true));
  if(a==='tab')return go(el.dataset.tab);
  if(a==='prev'||a==='next')return go(ORDER[ORDER.indexOf(tab)+(a==='next'?1:-1)]);
  if(a==='new')return newModal();
  if(a==='home'){setCur(null);render('F');return}
  if(a==='import')return $('#fileInput').click();
  if(a==='open'){const q=DB.find(x=>x.id===el.dataset.id);if(!q)return;setCur(q.id);tab=VIEWS.includes(q.tab)?q.tab:TITULOS[0].c;$('#buscador').value='';render('F');return}
  if(a==='dup'){const o=DB.find(x=>x.id===el.dataset.id),c=JSON.parse(JSON.stringify(o));c.id=uid('p');c.nombre=o.nombre+' (copia)';c.mod=Date.now();DB.push(c);persist();render('F');toast('Proyecto duplicado');return}
  if(a==='del'){const o=DB.find(x=>x.id===el.dataset.id);if(await confirmD('¿Eliminar proyecto?','Se borrará “'+esc(o.nombre)+'” con todas sus mediciones. No se puede deshacer.','Eliminar')){DB=DB.filter(x=>x.id!==o.id);persist();if(cur===o.id)setCur(null);render('F');toast('Proyecto eliminado')}return}
  if(!p)return;
  if(a==='editdatos')return editModal(p);
  if(a==='vm'){vmode=el.dataset.v;render('F');return}
  if(a==='export'){const b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=(p.nombre||'proyecto')+'.metrados.json';l.click();return}
  if(a==='xlsx')return xlsxExport(p);if(a==='csvm')return csvMetrados(p);if(a==='csvc')return csvCons(p);if(a==='print')return printPDF(p);
  if(a==='savedatos'){p.nombre=$('#fNombre').value.trim()||'Proyecto';p.ubicacion=$('#fUbic').value.trim();p.cliente=$('#fCli').value.trim();p.elaboradoPor=$('#fElab').value.trim();p.fecha=$('#fFecha').value;p.expediente=$('#fExp').value.trim();p.departamento=$('#fDep').value.trim();p.provincia=$('#fPro').value.trim();p.distrito=$('#fDis').value.trim();touch(p);render();toast('Datos guardados');return}
  if(a==='addrow'){const blk=el.closest('.blk'),r=p.mediciones.find(m=>m.codigo===blk.dataset.cod&&m.categoria===tab);const id=addMed(p,{c:r.codigo,d:r.descripcion,u:r.unidad,cat:r.categoria});render(null,{tree:false});flashRow(id);return}
  if(a==='delrow'){const id=el.closest('tr').dataset.id;p.mediciones=p.mediciones.filter(m=>m.id!==id);touch(p);render(null,{tree:false});return}
  if(a==='delp'){const c=el.closest('.blk').dataset.cod;if(await confirmD('¿Quitar partida?','Se quitarán todas las filas medidas de '+esc(c)+'.','Quitar')){p.mediciones=p.mediciones.filter(m=>!(m.codigo===c&&m.categoria===tab));touch(p);render()}}});
$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p||!Array.isArray(p.mediciones))throw 0;if(!p.id)p.id=uid('p');p.mod=Date.now();const i=DB.findIndex(x=>x.id===p.id);i>-1?DB[i]=p:DB.push(p);persist();setCur(p.id);tab=VIEWS.includes(p.tab)?p.tab:TITULOS[0].c;render('F');toast('Proyecto importado')}catch(err){toast('Archivo no válido')}};
  r.readAsText(f);e.target.value=''});
window.addEventListener('resize',()=>{const p=proj();if(p)updateTabs(p)});

/* ---------- paleta de colores ---------- */
const palPop=document.createElement('div');palPop.id='palPop';palPop.hidden=true;palPop.setAttribute('role','dialog');palPop.setAttribute('aria-label','Temas de color');document.body.appendChild(palPop);
const curPal=()=>{let id='jade';try{id=localStorage.getItem('metrados_paleta')||id}catch(e){}return PALS.find(x=>x.id===id)||PALS[0]};
function renderPal(){const dark=document.documentElement.dataset.theme==='dark',cp=curPal();
  palPop.innerHTML='<div class="pp-h"><b>Tema de color</b><div class="vt pp-mode"><button type="button" class="'+(dark?'':'on')+'" data-act="setmode" data-m="light">'+I('sun','sm')+'Claro</button><button type="button" class="'+(dark?'on':'')+'" data-act="setmode" data-m="dark">'+I('moon','sm')+'Oscuro</button></div></div><div class="pp-grid">'
  +PALS.map(P=>{const v=palVars(P,dark),on=P.id===cp.id;return '<button type="button" class="pal'+(on?' on':'')+'" data-act="setpal" data-id="'+P.id+'" aria-pressed="'+on+'"><span class="sw" style="background:'+v['--bg']+'"><i style="background:'+v['--accent']+';flex:2"></i><i style="background:'+v['--cat2']+'"></i><i style="background:'+v['--cat-ink']+'"></i></span><span class="pn">'+P.n+'</span></button>'}).join('')+'</div>'}
function togglePal(force){const open=force!=null?force:palPop.hidden,b=$('#btnPal');
  if(open){renderPal();const r=b.getBoundingClientRect();palPop.style.top=(r.bottom+8)+'px';palPop.style.right=Math.max(12,innerWidth-r.right)+'px';palPop.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>palPop.classList.add('on')))}
  else{palPop.classList.remove('on');setTimeout(()=>{if(!palPop.classList.contains('on'))palPop.hidden=true},220)}
  b.setAttribute('aria-expanded',open)}
function setPal(id){smooth(()=>{try{localStorage.setItem('metrados_paleta',id)}catch(e){}applyPal();$$('.pal',palPop).forEach(b=>{const on=b.dataset.id===id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})})}
document.addEventListener('mousedown',e=>{if(!palPop.hidden&&!e.target.closest('#palPop,#btnPal'))togglePal(false)});

function setTheme(t,save){document.documentElement.dataset.theme=t;if(save)try{localStorage.setItem('metrados_tema',t)}catch(e){}
  $('#btnTheme').innerHTML=I(t==='dark'?'sun':'moon')+'<span class="lbl">'+(t==='dark'?'Claro':'Oscuro')+'</span>';applyPal();if(palPop&&!palPop.hidden)renderPal()}
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');
document.addEventListener('click',e=>{if(e.target.closest('[data-act=theme]'))smooth(()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true))});
let _pt;addEventListener('beforeprint',()=>{_pt=document.documentElement.dataset.theme;document.documentElement.dataset.theme='light';applyPal()});addEventListener('afterprint',()=>{if(_pt){document.documentElement.dataset.theme=_pt;applyPal()}});
const vPop=document.createElement('div');vPop.id='vPop';vPop.hidden=true;vPop.setAttribute('role','menu');document.body.appendChild(vPop);
function renderV(){const p=proj();if(!p)return;const S=stats(p),it=(id,ic,t,s)=>'<button type="button" class="vi'+(tab===id?' on':'')+'" role="menuitem" data-act="goview" data-t="'+id+'">'+I(ic)+'<span><b>'+t+'</b><small>'+s+'</small></span></button>';
  vPop.innerHTML=it('consolidado','chart','Consolidado',S.np+' partidas · '+S.nm+' mediciones')+it('resumen','info','Resumen y datos','Panel, avance y datos del proyecto'+(S.al?' · '+S.al+' alertas':''))}
function toggleV(force){const open=force!=null?force:vPop.hidden,b=$('#btnV');
  if(open){renderV();const r=b.getBoundingClientRect();vPop.style.top=(r.bottom+8)+'px';vPop.style.left=Math.max(12,r.left)+'px';vPop.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>vPop.classList.add('on')));$('#vmenuWrap').classList.add('seen');try{localStorage.setItem('metrados_vm','1')}catch(e){}}
  else{vPop.classList.remove('on');setTimeout(()=>{if(!vPop.classList.contains('on'))vPop.hidden=true},230)}b.setAttribute('aria-expanded',open)}
document.addEventListener('mousedown',e=>{if(!vPop.hidden&&!e.target.closest('#vPop,#btnV'))toggleV(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!vPop.hidden)toggleV(false)});
try{if(localStorage.getItem('metrados_vm'))$('#vmenuWrap').classList.add('seen')}catch(e){}
setTimeout(()=>{const h=$('#vhint');h&&h.remove()},9500);
(function(){const b=document.body,i=$('#intro'),done=()=>b.classList.remove('boot');
  if(!i||matchMedia('(prefers-reduced-motion:reduce)').matches){i&&i.remove();done();return}
  $('#inMark').innerHTML=I('ruler');const out=()=>{i.classList.add('out');done();setTimeout(()=>i.remove(),900)};
  setTimeout(out,1300);i.onclick=out})();
function openSheet(o){$('#aside').classList.toggle('open',o);$('#scrim').classList.toggle('on',o);document.body.classList.toggle('lock',o)}
function moreModal(){const it=(a,ic,t)=>'<button type="button" class="vi" data-act="'+a+'">'+I(ic)+'<span><b>'+t+'</b></span></button>';
  modal('<h2>Más opciones</h2><div class="msheet">'+it('home','folder','Mis proyectos')+it('editdatos','edit','Datos del proyecto')+it('xlsx','save','Descargar Excel (.xlsx)')+it('print','printer','Guardar PDF')+it('import','upload','Importar proyecto')+'</div>')}
(function(){let x0,y0,t0,ok;
  content.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();ok=innerWidth<=860&&ORDER.includes(tab)&&!e.target.closest('input,select,.tbl-wrap')},{passive:true});
  content.addEventListener('touchend',e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>80&&Math.abs(dy)<45&&Date.now()-t0<600){const n=ORDER[ORDER.indexOf(tab)+(dx<0?1:-1)];n&&go(n)}},{passive:true})})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
buildTabs();
if(cur){const p=proj();if(VIEWS.includes(p.tab))tab=p.tab}
render('F');
</script>
